name: APK Desktop Bridge Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore APKDesktopBridge.sln

      - name: Build
        run: dotnet build APKDesktopBridge.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test APKDesktopBridge.sln -c Release --no-build

      - name: Publish Windows application
        run: >
          dotnet publish src/APKDesktopBridge/APKDesktopBridge.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build EXE installer
        run: iscc installer/APKDesktopBridge.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKDesktopBridge-Windows-x64
          path: installer/output/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
